name: 构建原生版 iOS 安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 上一次编译的中间产物。内容没变的文件直接用上次编好的，不再从零编
      - name: 取回上次的编译缓存
        uses: actions/cache@v4
        with:
          path: build
          key: derived-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: 对齐文件时间（让增量编译认得出哪些没改）
        run: python3 scripts/ci/stamp_mtimes.py

      - name: 看一眼 Xcode 版本
        run: |
          xcodebuild -version
          xcodebuild -list -project Qi.xcodeproj

      - name: 生成自定义图标
        run: |
          chmod +x scripts/make-icons.sh
          ./scripts/make-icons.sh

      - name: 编译（不签名）
        # 编译报错逐条打成 ::error 标注：标注走公开接口就读得到，
        # 在没有 Xcode 的 Windows 上也能知道是哪个文件哪一行没编过
        run: |
          set +e
          xcodebuild \
            -project Qi.xcodeproj \
            -scheme Qi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_COMPILATION_MODE=singlefile \
            build 2>&1 | tee build.log | grep --line-buffered -E "^(SwiftCompile|CompileSwift|CompileAssetCatalog|Ld|\*\*)" | cut -c1-160
          code=${PIPESTATUS[0]}
          grep -E "^/.+:[0-9]+:[0-9]+: error: " build.log | sort -u | head -40 | while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1)
            l=$(echo "$line" | cut -d: -f2)
            m=$(echo "$line" | cut -d: -f5- | sed 's/^ *//')
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$l::$m"
          done
          tail -40 build.log
          exit $code

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Qi.app Payload/Qi.app
          zip -qry Qi-native.ipa Payload
          ls -lh Qi-native.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Qi-native-ipa
          path: Qi-native.ipa
          retention-days: 30
