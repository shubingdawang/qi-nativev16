<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>甜品屋</title>
<style>
:root {
  --paper: #fbf7f1; --cream: #f6efe6; --line: rgba(120, 90, 70, .14); --ink: #4a3a33; --soft: #8a7466; --mute: #b3a294;
  --rose: #d98a9a; --roseL: #f6dfe2; --sage: #8fa884; --sageL: #e6eddf; --gold: #c8a96c; --goldL: #f3e8cf; --red: #d0606f;
  --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6da; color: var(--ink); font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, sans-serif; }
canvas { display: block; touch-action: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* 顶上 */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safeT) + 8px) 14px 8px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.chip { background: rgba(251, 247, 241, .9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 10px rgba(90, 60, 40, .08); white-space: nowrap; }
#dayChip b { font-weight: 600; }
#clock { font-variant-numeric: tabular-nums; font-weight: 600; }
#money { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
#money .y { color: var(--red); font-weight: 500; }
#lvChip { padding: 4px 10px 4px 4px; }
#lvRing { width: 26px; height: 26px; }
#exit { width: 34px; height: 34px; padding: 0; justify-content: center; }
#phase { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safeT) + 54px); display: flex; gap: 8px; }
.cta { white-space: nowrap; background: var(--ink); color: #fbf7f1; border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(74, 58, 51, .25); }
.cta.rose { background: var(--rose); }
.cta.ghost { background: rgba(251, 247, 241, .92); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(90, 60, 40, .08); font-weight: 500; }
.cta[disabled] { opacity: .45; }
#tip { position: fixed; left: 14px; right: 14px; top: calc(var(--safeT) + 102px); display: none; }
#tip .box { margin: 0 auto; max-width: 420px; background: rgba(251, 247, 241, .95); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.5; color: var(--soft); box-shadow: 0 4px 16px rgba(90, 60, 40, .1); display: flex; gap: 10px; align-items: flex-start; }
#tip .box svg { flex: none; color: var(--rose); margin-top: 1px; }

/* 底下 */
#nav { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safeB) + 10px); display: flex; background: rgba(251, 247, 241, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: 0 8px 24px rgba(90, 60, 40, .12); }
#nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 16px; font-size: 11px; color: var(--soft); position: relative; }
#nav button.on { background: var(--cream); color: var(--ink); font-weight: 600; }
#nav button .dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 50%; background: var(--rose); display: none; }

/* 底下弹出来的面板 */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78%; background: var(--paper); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(90, 60, 40, .15); transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; padding-bottom: var(--safeB); z-index: 20; }
#sheet.open { transform: none; }
#sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: rgba(120, 90, 70, .2); margin: 8px auto 2px; flex: none; }
#sheet header { display: flex; align-items: center; padding: 6px 18px 10px; gap: 10px; flex: none; }
#sheet header h2 { font-size: 17px; margin: 0; font-weight: 600; }
#sheet header .sub { font-size: 12px; color: var(--mute); }
#sheet header .x { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; }
#sheet .tabs { display: flex; gap: 6px; padding: 0 18px 10px; flex: none; overflow-x: auto; }
#sheet .tabs button { padding: 6px 14px; border-radius: 999px; background: var(--cream); font-size: 12.5px; color: var(--soft); white-space: nowrap; }
#sheet .tabs button.on { background: var(--ink); color: var(--paper); }
#sheet .body { overflow-y: auto; padding: 0 16px 20px; -webkit-overflow-scrolling: touch; }
#mask { position: fixed; inset: 0; background: rgba(60, 40, 30, .18); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 19; }
#mask.on { opacity: 1; pointer-events: auto; }

.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.t1 { font-size: 14px; font-weight: 600; }
.t2 { font-size: 12px; color: var(--soft); line-height: 1.5; }
.t3 { font-size: 11px; color: var(--mute); }
.price { font-weight: 600; font-variant-numeric: tabular-nums; }
.btn { padding: 7px 12px; border-radius: 12px; background: var(--cream); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.rose { background: var(--roseL); color: #a8505f; }
.btn[disabled] { opacity: .4; }
.tag { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--sageL); color: #5f7656; margin: 2px 3px 0 0; }
.tag.rose { background: var(--roseL); color: #a8505f; }
.tag.gold { background: var(--goldL); color: #8a6a3a; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; position: relative; }
.pick.on { border-color: var(--rose); background: #fffafa; }
.pick[disabled] { opacity: .45; }
.pick canvas { margin: 0 auto 4px; }
.pick .lock { position: absolute; inset: 0; border-radius: 16px; background: rgba(251, 247, 241, .75); display: grid; place-items: center; font-size: 11px; color: var(--soft); }
.step { display: flex; align-items: center; gap: 2px; background: var(--cream); border-radius: 12px; }
.step button { width: 30px; height: 30px; font-size: 16px; }
.step span { min-width: 30px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.bar { height: 6px; background: var(--cream); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--rose); border-radius: 3px; }
.bar.sage i { background: var(--sage); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 12px; }
.empty { text-align: center; color: var(--mute); font-size: 13px; padding: 30px 10px; line-height: 1.7; }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* 客人 / clawd 的小卡片 */
#pop { position: fixed; z-index: 15; width: 250px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: 0 10px 30px rgba(90, 60, 40, .18); display: none; }
#pop .say { font-size: 13.5px; line-height: 1.5; margin: 4px 0 10px; }
#pop .who { font-size: 12px; color: var(--soft); }
#pop .list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
#pop .list button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: #fff; border: 1px solid var(--line); text-align: left; }
#pop .list button canvas { flex: none; }

/* 厨房 */
#kitchen { position: fixed; inset: 0; background: linear-gradient(#f7efe4, #efe3d3); z-index: 30; display: none; flex-direction: column; padding-top: var(--safeT); padding-bottom: var(--safeB); }
#kitchen.open { display: flex; }
#kHead { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
#kHead h2 { margin: 0; font-size: 17px; font-weight: 600; }
#kSteps { display: flex; gap: 4px; padding: 0 16px 8px; }
#kSteps i { flex: 1; height: 3px; border-radius: 2px; background: rgba(120, 90, 70, .14); }
#kSteps i.on { background: var(--rose); }
#kBody { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; }
#kc { width: 100%; border-radius: 22px; background: radial-gradient(circle at 50% 40%, #fffaf3, #f3e8d9); box-shadow: inset 0 0 0 1px var(--line); }
.tools { display: flex; gap: 6px; margin: 10px 0 6px; overflow-x: auto; padding-bottom: 2px; }
.tools button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 10px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line); font-size: 11px; color: var(--soft); min-width: 54px; }
.tools button.on { border-color: var(--rose); color: var(--ink); }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.palette { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; }
.palette button { flex: none; width: 58px; padding: 6px 2px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line); font-size: 10px; color: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.palette button.on { border-color: var(--rose); }
.meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--soft); margin: 4px 2px; }
.meter .bar { flex: 1; }

#toast { position: fixed; left: 50%; top: calc(var(--safeT) + 110px); transform: translateX(-50%) translateY(-10px); background: rgba(74, 58, 51, .92); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 50; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <button class="chip" id="exit" aria-label="离开"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="chip" id="dayChip"></div>
  <div class="chip" id="money"></div>
  <button class="chip" id="lvChip"><canvas id="lvRing" width="52" height="52"></canvas><span id="lvText"></span></button>
</div>
<div id="phase"></div>
<div id="tip"><div class="box"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span id="tipText"></span></div></div>
<nav id="nav">
  <button data-tab="shop" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10M4 10h16v10H4zM4 10c0 1.5 1.3 2.5 2.7 2.5S9.3 11.5 9.3 10c0 1.5 1.3 2.5 2.7 2.5s2.7-1 2.7-2.5c0 1.5 1.3 2.5 2.7 2.5S20 11.5 20 10M10 20v-5h4v5"/></svg>店面<i class="dot"></i></button>
  <button data-tab="kitchen"><svg class="i" viewBox="0 0 24 24"><path d="M7 11a5 5 0 0 1 10 0M5 11h14l-1.2 7.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8zM12 6V3M9 4l1 2M15 4l-1 2"/></svg>厨房<i class="dot"></i></button>
  <button data-tab="market"><svg class="i" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>集市<i class="dot"></i></button>
  <button data-tab="book"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10M9 8h5"/></svg>配方簿<i class="dot"></i></button>
  <button data-tab="decor"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16M6 20v-6a6 6 0 0 1 12 0v6M9 20v-4h6v4M12 4v4M9 6h6"/></svg>装修<i class="dot"></i></button>
</nav>
<div id="mask"></div>
<section id="sheet"><div class="grab"></div><header><div><h2 id="sTitle"></h2><div class="sub" id="sSub"></div></div><button class="x" id="sClose" aria-label="收起"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="tabs" id="sTabs"></div><div class="body" id="sBody"></div></section>
<div id="pop"></div>
<section id="kitchen">
  <div id="kHead"><button class="x" id="kBack" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h2 id="kTitle"></h2><span class="t3" id="kSub" style="margin-left:auto"></span></div>
  <div id="kSteps"></div>
  <div id="kBody"></div>
</section>
<div id="toast"></div>
<script src="bakery_data.js"></script>
<script src="bakery_art.js"></script>
<script src="bakery_scene.js"></script>
<script src="bakery_game.js"></script>
</body>
</html>
